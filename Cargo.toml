[package]
name = "corpora-core-rs"
version = "0.1.0"
edition = "2021"
description = "Shared Tauri core bindings and official plugin re-exports for Corpora apps."
license = "MIT"
repository = "https://github.com/exegia/corpora-core-rs"
readme = "README.md"
rust-version = "1.77.2"

[dependencies]
tauri = { version = "2.11.3", default-features = false }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-barcode-scanner = "2.4.5"
tauri-plugin-biometric = "2.3.2"
tauri-plugin-cli = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-geolocation = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-haptics = "2.3.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-localhost = "2.3.2"
tauri-plugin-log = "2.8.0"
tauri-plugin-nfc = "2.3.5"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-persisted-scope = "2.3.7"
tauri-plugin-positioner = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-sql = "2.4.0"
tauri-plugin-store = "2.4.3"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-upload = "2.4.0"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-window-state = "2.4.1"
