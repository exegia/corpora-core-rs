name: Build and release crate

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'next'
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release crate
        run: cargo build --release --all-features

      - name: Package crate
        run: cargo package

      - name: Read crate metadata
        id: crate
        run: |
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[0]
            | "name=\(.name)\nversion=\(.version)\nartifact=target/package/\(.name)-\(.version).crate"
          ' >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.crate.outputs.version }}
          name: ${{ steps.crate.outputs.name }} v${{ steps.crate.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: ${{ steps.crate.outputs.artifact }}
